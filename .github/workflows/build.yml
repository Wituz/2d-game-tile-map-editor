name: Build Map Editor

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macOS'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            os_name: 'macOS-ARM'
            rust_target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux'
            rust_target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os_name: 'Windows'
            rust_target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    name: Build for ${{ matrix.os_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build for macOS ARM (cross-compile)
        if: matrix.rust_target == 'aarch64-apple-darwin'
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          NO_STRIP: 1

      - name: Build for other platforms
        if: matrix.rust_target != 'aarch64-apple-darwin'
        run: npm run tauri build
        env:
          NO_STRIP: 1

      - name: Upload artifacts (macOS x86_64)
        if: matrix.rust_target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn

      - name: Upload artifacts (macOS ARM)
        if: matrix.rust_target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Organize release files
        run: |
          mkdir -p release-files
          # Copy macOS x86_64 files (rename to include architecture if needed)
          if [ -d "artifacts/macos-x86_64" ]; then
            for file in artifacts/macos-x86_64/*.dmg artifacts/macos-x86_64/**/*.dmg; do
              [ -f "$file" ] && cp "$file" "release-files/$(basename "$file" .dmg)_x86_64.dmg"
            done
            for file in artifacts/macos-x86_64/*.app.tar.gz artifacts/macos-x86_64/**/*.app.tar.gz; do
              [ -f "$file" ] && cp "$file" "release-files/$(basename "$file" .app.tar.gz)_x86_64.app.tar.gz"
            done
          fi
          # Copy macOS ARM files (already have _aarch64 in name from Tauri)
          if [ -d "artifacts/macos-aarch64" ]; then
            find artifacts/macos-aarch64 -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) -exec cp {} release-files/ \;
          fi
          # Copy Linux files
          if [ -d "artifacts/linux-x86_64" ]; then
            find artifacts/linux-x86_64 -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec cp {} release-files/ \;
          fi
          # Copy Windows files
          if [ -d "artifacts/windows-x86_64" ]; then
            find artifacts/windows-x86_64 -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} release-files/ \;
          fi
          echo "Release files:"
          ls -la release-files/

      - name: Delete existing release if it exists
        continue-on-error: true
        run: gh release delete ${{ github.ref_name }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
